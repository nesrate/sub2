<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Monetag</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        #downloadDxfBtn {
            padding: 15px 30px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 18px;
            cursor: pointer;

            transition: .3s;
        }

        #downloadDxfBtn:hover {
            transform: scale(1.05);
        }

    </style>

</head>

<body>


<button id="downloadDxfBtn">
    Ouvrir YouTube
</button>


<script>

    // MONETAG
    document.getElementById("downloadDxfBtn").addEventListener("click", function () {

        const monetagLink =
            "https://omg10.com/4/11552429";

        // Ouvre le Direct Link dans un nouvel onglet
        window.open(
            monetagLink,
            "_blank"
        );

    });


</script>

</body>

</html>
